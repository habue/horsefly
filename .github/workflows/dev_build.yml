name: Build Meteor 26.1.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horsefly-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Checksum installable JAR
        run: cd build/libs && sha256sum horsefly-1.0.2.jar > horsefly-1.0.2.jar.sha256

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: horsefly-meteor-26.1.2
          path: |
            build/libs/horsefly-1.0.2.jar
            build/libs/horsefly-1.0.2.jar.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: horsefly-meteor-26.1.2
          path: build

      - name: Update development release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: snapshot
          target_commitish: ${{ github.sha }}
          name: HorseFly for Meteor 26.1.2
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            build/horsefly-1.0.2.jar
            build/horsefly-1.0.2.jar.sha256
